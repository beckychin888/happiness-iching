<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>易經六十四卦｜每日能量指引・幸福力學院</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#18294b;background:#f7f6f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:32px 18px 80px}header{text-align:center;background:#162a52;color:#f9f0d5;border-radius:24px;padding:40px 18px}header small{letter-spacing:2px;color:#d6bf87}h1{font-size:clamp(25px,5vw,38px);margin:15px 0}button{background:#243f78;color:white;border:0;border-radius:12px;padding:14px 24px;font-size:17px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.card{margin:20px 0;background:white;padding:26px;border-radius:20px;box-shadow:0 5px 25px #13244812}.center{text-align:center}.symbol{font-size:88px;line-height:1.4;color:#b49b5e}.muted{color:#68768b}.hidden{display:none}label{display:block;margin:12px 0 6px;font-weight:600}input[type=email],input[type=text]{width:100%;padding:13px;border:1px solid #b9c2cf;border-radius:9px;font-size:16px}.check{display:flex;gap:10px;align-items:start;font-weight:400}.check input{margin-top:5px}h2{font-size:23px}h3{font-size:17px;margin:22px 0 8px;color:#213c6c}.error{color:#b12b2b}.success{color:#23644b}footer{text-align:center;color:#67738a;margin-top:30px;font-size:13px}a{color:#24457d}#status{min-height:22px}
</style></head><body><main class="wrap"><header><small>HAPPINESS POWER ACADEMY</small><h1>☯️ 易經六十四卦</h1><p>每日能量指引｜覺察・轉念・行動</p><p>今天，哪一個提醒最值得你留意？</p><button id="draw">抽取今日卦象</button></header><section id="preview" class="card center hidden"><div id="symbol" class="symbol"></div><h2 id="name"></h2><h3 id="theme"></h3><p id="keywords" class="muted"></p></section><section id="formbox" class="card hidden"><h2>領取完整卦象解讀</h2><p>留下 Email，即可在網頁閱讀完整內容，並寄送一份到你的信箱。</p><form id="lead"><label for="nameInput">稱呼（選填）</label><input id="nameInput" type="text" maxlength="80" autocomplete="name"><label for="email">電子信箱 *</label><input id="email" type="email" required maxlength="254" autocomplete="email"><label class="check"><input type="checkbox" id="consent"><span>我願意另外訂閱幸福力學院的幸福練習、活動與課程資訊，了解可隨時取消訂閱。<strong>不勾選仍可領取本次卦象解讀。</strong></span></label><p class="muted" style="font-size:13px">資料僅用於本次解讀寄送與你同意的訂閱用途。正式上線前請加入隱私權政策連結及聯絡窗口。</p><button type="submit" id="submit">查看完整解讀並寄送 Email</button><p id="status" role="status"></p></form></section><section id="full" class="card hidden"><h2>你的今日完整解讀</h2><div id="content"></div><p class="muted">卦象為生活反思的參考，不是對未來的確定預言。</p></section><footer>幸福力學院｜覺察・轉念・行動</footer></main><script>
let cards=[],selected=null;const $=id=>document.getElementById(id);fetch('/hexagrams.json').then(r=>r.json()).then(d=>cards=d).catch(()=>{$('status').textContent='卦象資料載入失敗，請重新整理。'});
$('draw').onclick=()=>{if(!cards.length){alert('資料載入中，請稍後再試');return;}selected=cards[Math.floor(Math.random()*cards.length)];$('symbol').textContent=selected.symbol;$('name').textContent=`${selected.number}. ${selected.name}（${selected.full_name}）`;$('theme').textContent=selected.theme;$('keywords').textContent=selected.keywords;$('preview').classList.remove('hidden');$('formbox').classList.remove('hidden');$('full').classList.add('hidden');$('status').textContent='';$('preview').scrollIntoView({behavior:'smooth'});};
const paragraph=(heading,value)=>{const h=document.createElement('h3');h.textContent=heading;const p=document.createElement('p');p.textContent=value;$('content').append(h,p)};
$('lead').onsubmit=async e=>{e.preventDefault();if(!selected)return;const btn=$('submit');btn.disabled=true;$('status').textContent='處理中…';try{const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:selected.number,email:$('email').value.trim(),name:$('nameInput').value.trim(),marketing_consent:$('consent').checked})});const data=await r.json();if(!r.ok)throw Error(data.error||'提交失敗');$('content').replaceChildren();paragraph('卦象解析',selected.analysis);paragraph('宇宙提醒',selected.reminder);paragraph('今日覺察提問',selected.question);paragraph('今日行動建議',selected.action);$('full').classList.remove('hidden');$('status').className=data.email_sent?'success':'muted';$('status').textContent=data.email_sent?'已提交，卦象解讀信正在寄送。':'完整解讀已解鎖；郵件尚未寄出，請稍後再試。';$('full').scrollIntoView({behavior:'smooth'});}catch(err){$('status').className='error';$('status').textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
