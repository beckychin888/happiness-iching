<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸福力易經｜管理後台</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#24354a;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1150px;margin:auto;padding:32px 18px}h1{font-size:28px;margin:0 0 8px}p{color:#60717e}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat,.panel{background:white;border:1px solid #e3e9ed;border-radius:16px;padding:20px}.stat span{font-size:14px;color:#667782}.stat strong{display:block;font-size:32px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}button,a.action{border:0;border-radius:9px;background:#203c54;color:white;padding:12px 16px;font-size:14px;text-decoration:none;cursor:pointer}button.secondary{background:#4c6679}input{padding:12px;border:1px solid #ccd6df;border-radius:9px;min-width:230px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #e6eaef;padding:12px 10px;font-size:14px}th{background:#f7f9fa}small{color:#667782}.barrow{display:flex;align-items:center;gap:10px;margin:10px 0}.barrow>span{min-width:85px}.bar{background:#c8dbe4;border-radius:5px;height:18px;min-width:2px}.error{color:#b32222}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}
</style></head><body><main class="wrap"><h1>幸福力學院｜易經數據管理後台</h1><p>Email 名單、訂閱同意、卦象與每日新增紀錄</p><p id="message">正在讀取資料…</p><div class="stats"><div class="stat"><span>Email 收集總數</span><strong id="emails">—</strong></div><div class="stat"><span>同意訂閱人數</span><strong id="subscribed">—</strong></div><div class="stat"><span>今日新增 Email（UTC）</span><strong id="today">—</strong></div><div class="stat"><span>累積抽卦次數</span><strong id="draws">—</strong></div></div><section class="panel"><h2>每日新增名單（最近 30 天，有新增的日期）</h2><div id="daily"></div></section><section class="panel" style="margin-top:18px"><h2>訪客與抽卦紀錄</h2><div class="toolbar"><input id="search" type="search" placeholder="搜尋稱呼、Email 或卦號"><button id="refresh">重新整理</button><button class="secondary" id="all">匯出全部 CSV</button><button class="secondary" id="sub">匯出已同意訂閱 CSV</button></div><small id="count"></small><div class="scroll"><table><thead><tr><th>稱呼</th><th>Email</th><th>同意訂閱</th><th>首次留資</th><th>抽卦次數</th><th>最近卦象</th><th>最近抽卦時間</th></tr></thead><tbody id="records"></tbody></table></div><p><small>每位訪客顯示最近一次抽到的卦象；抽卦次數包含歷次紀錄。時間欄位採資料庫原始時間（通常為 UTC）。一次最多顯示 5,000 位訪客。</small></p></section></main><script>
const $=id=>document.getElementById(id);let data=null;const hexNames=['乾為天','坤為地','水雷屯','山水蒙','水天需','天水訟','地水師','水地比','風天小畜','天澤履','地天泰','天地否','天火同人','火天大有','地山謙','雷地豫','澤雷隨','山風蠱','地澤臨','風地觀','火雷噬嗑','山火賁','山地剝','地雷復','天雷無妄','山天大畜','山雷頤','澤風大過','坎為水','離為火','澤山咸','雷風恆','天山遯','雷天大壯','火地晉','地火明夷','風火家人','火澤睽','水山蹇','雷水解','山澤損','風雷益','澤天夬','天風姤','澤地萃','地風升','澤水困','水風井','澤火革','火風鼎','震為雷','艮為山','風山漸','雷澤歸妹','雷火豐','火山旅','巽為風','兌為澤','風水渙','水澤節','風澤中孚','雷山小過','水火既濟','火水未濟'];
function td(tr,value){const cell=document.createElement('td');cell.textContent=value??'';tr.append(cell)}
function render(){if(!data)return;const term=$('search').value.trim().toLowerCase();const rows=data.visitors.filter(r=>[r.name,r.email,r.latest_hexagram].some(v=>String(v??'').toLowerCase().includes(term)));$('records').replaceChildren();for(const r of rows){const tr=document.createElement('tr');td(tr,r.name||'（未填）');td(tr,r.email);td(tr,r.marketing_consent===1?'同意':'未同意');td(tr,r.created_at);td(tr,r.draw_count);td(tr,r.latest_hexagram?`${r.latest_hexagram}. ${hexNames[r.latest_hexagram-1]||''}`:'—');td(tr,r.latest_draw_at||'—');$('records').append(tr)}$('count').textContent=`顯示 ${rows.length} 位訪客`}
async function load(){try{$('message').textContent='正在讀取資料…';const res=await fetch('/api/admin/data',{credentials:'same-origin',cache:'no-store'});const result=await res.json();if(!res.ok)throw Error(result.error||'讀取失敗');data=result;for(const k of ['emails','subscribed','today','draws'])$(k).textContent=result.totals[k];$('daily').replaceChildren();const max=Math.max(1,...result.daily.map(x=>x.count));for(const item of result.daily){const row=document.createElement('div');row.className='barrow';const date=document.createElement('span');date.textContent=item.day;const bar=document.createElement('div');bar.className='bar';bar.style.width=(item.count/max*75)+'%';const count=document.createElement('span');count.textContent=item.count;row.append(date,bar,count);$('daily').append(row)}render();$('message').textContent='資料已更新';}catch(e){$('message').className='error';$('message').textContent=e.message}}
async function download(kind){try{const res=await fetch('/api/admin/data?export='+kind,{credentials:'same-origin',cache:'no-store'});if(!res.ok){const d=await res.json();throw Error(d.error||'匯出失敗')}const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='iching-'+kind+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){alert(e.message)}}
$('search').addEventListener('input',render);$('refresh').onclick=load;$('all').onclick=()=>download('all');$('sub').onclick=()=>download('sub');load();
</script></body></html>
