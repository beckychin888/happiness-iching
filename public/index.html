<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>易經六十四卦｜每日能量指引・幸福力學院</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#24354a;background:#f7f8f5}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8f6f1 url("/nordic-background.png") center top / cover fixed no-repeat}.wrap{max-width:900px;margin:auto;padding:30px 18px 65px}header{position:relative;overflow:hidden;text-align:center;border-radius:28px;padding:65px 30px 58px;background:linear-gradient(135deg,#fffefaed 0%,#f8fbf9e8 58%,#f4f8f7e6 100%);border:1px solid #e4eae8;box-shadow:0 20px 55px #1b35410b}header:before{content:'';position:absolute;width:360px;height:360px;border:1px solid #d8e2df;border-radius:50%;right:-145px;top:-190px;box-shadow:0 0 0 45px #eaf1ef65,0 0 0 90px #edf2f03d;pointer-events:none}header:after{content:'☰';position:absolute;bottom:12px;right:30px;font-size:65px;color:#c3d1cc66;transform:rotate(-12deg);pointer-events:none}header small{position:relative;letter-spacing:3px;color:#718580;font-weight:650;font-size:12px}h1{position:relative;font-size:clamp(32px,6vw,52px);margin:20px 0 24px;letter-spacing:2px;font-weight:700}.intro{position:relative;max-width:650px;margin:0 auto 22px;line-height:2;font-size:clamp(15px,2.4vw,17px);font-weight:400;color:#4d5e69}.intro strong{display:block;margin:20px auto 0;padding:18px 23px;border-radius:16px;background:#fffefa;border-left:3px solid #8ca9a1;color:#304a53;line-height:1.9;max-width:610px;font-weight:600;box-shadow:0 6px 22px #304b5409}.question{position:relative;font-size:17px;margin:26px 0 16px;color:#526775}button{background:#203c54;color:#fff;border:0;border-radius:100px;padding:16px 36px;font-size:17px;cursor:pointer;box-shadow:0 9px 24px #203c5426;transition:transform .2s,background .2s}button:hover{background:#31556c;transform:translateY(-2px)}button:disabled{opacity:.55;cursor:wait}.card{margin:24px 0;background:#fff;padding:clamp(24px,5vw,42px);border-radius:24px;border:1px solid #e4e9e6;box-shadow:0 12px 35px #24354a0b}.center{text-align:center}.symbol{font-size:94px;line-height:1.4;color:#7e9b94}.muted{color:#73838b}.hidden{display:none}label{display:block;margin:12px 0 6px;font-weight:600}input[type=email],input[type=text]{width:100%;padding:14px;border:1px solid #cdd9d7;border-radius:12px;font-size:16px;background:#fff}.check{display:flex;gap:10px;align-items:start;font-weight:400;line-height:1.7}.check input{margin-top:7px}h2{font-size:clamp(22px,4vw,29px)}h3{font-size:18px;margin:22px 0 8px;color:#365a66}.error{color:#b12b2b}.success{color:#23644b}footer{text-align:center;color:#edf5f3;margin-top:34px;font-size:15px;font-weight:500;letter-spacing:.7px;background:#203c54;border-radius:20px;padding:28px 16px 30px}footer img{display:block;width:min(245px,70%);height:auto;object-fit:contain;margin:0 auto 12px}footer .footline{font-size:clamp(14px,2.5vw,18px)}footer .footline{opacity:.94}a{color:#24457d}#status{min-height:22px}#preview h2{margin:8px 0}#preview h3{color:#587a73}#preview .preview-content{text-align:left;border-top:1px solid #e4e9e6;margin-top:30px;padding-top:22px}#preview .preview-content p{line-height:1.9;margin:8px 0 22px}#full p{line-height:1.9}@media(max-width:550px){body{background-attachment:scroll;background-size:auto 100%}header{padding:48px 18px 42px}.wrap{padding:12px 12px 48px}header:before{width:250px;height:250px;right:-130px;top:-140px}footer img{max-width:150px}}
.brand-logo{display:block;position:relative;width:min(520px,85%);height:auto;margin:0 auto 18px}h1{margin-top:8px}header{padding-top:44px}button#draw{border:3px solid #e5c47b;background:linear-gradient(180deg,#12627b,#07334b);box-shadow:0 6px 0 #c59b53,0 12px 24px #203c5426}button#draw:hover{background:#174c66}@media(max-width:550px){.brand-logo{width:90%}}</style></head><body><main class="wrap"><header><img class="brand-logo" src="/happiness-power-logo-blue.png" alt="Happiness Power 幸福力學院"><h1>☯️ 易經六十四卦</h1><div class="intro">易經不只是古老的占卜智慧，更是一套幫助我們理解生活、思考選擇的導航系統。<br>它幫助你看清現在所處的位置，觀察事情可能發展的方向。<strong>它不是告訴你未來一定會發生什麼，而是提醒你：面對眼前的情況，可以怎麼選擇、怎麼行動，讓事情往更好的方向發展。</strong></div><p class="question">今天，哪一個提醒最值得你留意？</p><button id="draw">抽取今日卦象</button></header><section id="preview" class="card center hidden"><div id="symbol" class="symbol"></div><h2 id="name"></h2><h3 id="theme"></h3><p id="keywords" class="muted"></p><div id="previewContent" class="preview-content"></div></section><section id="formbox" class="card hidden"><h2>領取完整卦象解讀</h2><p>留下 Email，即可在網頁閱讀完整內容，包含工作與事業、人際關係、內在信念、趨吉避凶，並寄送一份到你的信箱。</p><form id="lead"><label for="nameInput">稱呼（選填）</label><input id="nameInput" type="text" maxlength="80" autocomplete="name"><label for="email">電子信箱 *</label><input id="email" type="email" required maxlength="254" autocomplete="email"><label class="check"><input type="checkbox" id="consent"><span>我願意另外訂閱幸福力學院的幸福練習、活動與課程資訊，了解可隨時取消訂閱。<strong>不勾選仍可領取本次卦象解讀。</strong></span></label><p class="muted" style="font-size:13px">資料僅用於本次解讀寄送與你同意的訂閱用途。正式上線前請加入隱私權政策連結及聯絡窗口。</p><button type="submit" id="submit">查看完整解讀並寄送 Email</button><p id="status" role="status"></p></form></section><section id="full" class="card hidden"><h2>你的今日完整解讀</h2><div id="content"></div><p class="muted">卦象為生活反思的參考，不是對未來的確定預言。</p></section></main><script>
let cards=[],selected=null;const $=id=>document.getElementById(id);fetch('/hexagrams.json').then(r=>r.json()).then(d=>cards=d).catch(()=>{$('status').textContent='卦象資料載入失敗，請重新整理。'});
$('draw').onclick=()=>{if(!cards.length){alert('資料載入中，請稍後再試');return;}selected=cards[Math.floor(Math.random()*cards.length)];$('symbol').textContent=selected.symbol;$('name').textContent=`${selected.number}. ${selected.name}（${selected.full_name}）`;$('theme').textContent=selected.theme;$('keywords').textContent=selected.keywords;$('previewContent').replaceChildren();paragraph('卦象簡短解析',selected.analysis,'previewContent');paragraph('🌿 一句提醒',selected.reminder,'previewContent');paragraph('💛 覺察提問',selected.question,'previewContent');paragraph('✨ 簡短行動建議',selected.action,'previewContent');$('preview').classList.remove('hidden');$('formbox').classList.remove('hidden');$('full').classList.add('hidden');$('status').textContent='';$('preview').scrollIntoView({behavior:'smooth'});};
const paragraph=(heading,value,target='content')=>{const h=document.createElement('h3');h.textContent=heading;const p=document.createElement('p');p.textContent=value;$(target).append(h,p)};
$('lead').onsubmit=async e=>{e.preventDefault();if(!selected)return;const btn=$('submit');btn.disabled=true;$('status').textContent='處理中…';try{const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:selected.number,email:$('email').value.trim(),name:$('nameInput').value.trim(),marketing_consent:$('consent').checked})});const data=await r.json();if(!r.ok)throw Error(data.error||'提交失敗');$('content').replaceChildren();paragraph('卦象解析',selected.analysis);paragraph('宇宙提醒',selected.reminder);paragraph('今日覺察提問',selected.question);paragraph('今日行動建議',selected.action);$('full').classList.remove('hidden');$('status').className=data.email_sent?'success':'muted';$('status').textContent=data.email_sent?'已提交，卦象解讀信正在寄送。':'完整解讀已解鎖；郵件尚未寄出，請稍後再試。';$('full').scrollIntoView({behavior:'smooth'});}catch(err){$('status').className='error';$('status').textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
